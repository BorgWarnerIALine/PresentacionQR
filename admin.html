<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrador de Presentaciones</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    background:#f4f6f9;
    min-height:100vh;
}

.header{
    background:#0054a6;
    color:white;
    padding:20px 40px;
    font-size:24px;
    font-weight:bold;
}

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:calc(100vh - 80px);
}

.card{
    background:white;
    width:500px;
    max-width:90%;
    padding:40px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#0054a6;
    margin-bottom:25px;
}

input[type="file"]{
    width:100%;
    padding:10px;
    margin-bottom:20px;
}

button{
    width:100%;
    background:#0054a6;
    color:white;
    border:none;
    padding:14px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#003f7d;
}

#resultado{
    margin-top:20px;
    text-align:center;
    font-weight:bold;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#777;
    font-size:12px;
}

</style>

</head>
<body>

<div class="header">
    BorgWarner • Presentation Manager
</div>

<div class="container">

    <div class="card">
<img
    src="logo.png"
    style="
    display:block;
    margin:0 auto 25px auto;
    max-width:250px;
    width:100%;
    height:auto;">
        <h1>Actualizar Presentación</h1>

        <input
            type="file"
            id="pdfFile"
            accept=".pdf">

        <button onclick="subirPDF()">
            Actualizar Presentación
        </button>

        <div id="resultado"></div>



    </div>

</div>

<script>

async function subirPDF(){

    const archivo =
        document.getElementById("pdfFile").files[0];

    if(!archivo){

        alert("Selecciona un PDF");
        return;
    }

    const resultado =
        document.getElementById("resultado");

    resultado.innerHTML =
        "Actualizando presentación...";

    try{

        const arrayBuffer =
            await archivo.arrayBuffer();

        const bytes =
            new Uint8Array(arrayBuffer);

        let binary = "";

        for(let i = 0; i < bytes.length; i++){

            binary +=
                String.fromCharCode(bytes[i]);
        }

        const base64 =
            btoa(binary);

        const response =
            await fetch(
                "/api/upload",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        pdf: base64
                    })
                }
            );

        const data =
            await response.json();

        if(data.success){

            resultado.innerHTML =
                "Presentación actualizada correctamente";
        }
        else{

            resultado.innerHTML =
                data.error;
        }

    }
    catch(ex){

        resultado.innerHTML =
            ex.message;
    }

}

</script>

</body>
</html>
