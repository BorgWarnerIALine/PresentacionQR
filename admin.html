<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualizar Presentación</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width:600px;
    margin:50px auto;
    text-align:center;
}

button{
    margin-top:20px;
    padding:10px 20px;
}

#resultado{
    margin-top:20px;
    font-weight:bold;
}
</style>

</head>
<body>

<h1>Actualizar Presentación</h1>

<input
    type="file"
    id="pdfFile"
    accept=".pdf">

<br>

<button onclick="subirPDF()">
    Actualizar Presentación
</button>

<div id="resultado"></div>

<script>

async function subirPDF(){

    const archivo =
        document.getElementById("pdfFile").files[0];

    if(!archivo){

        alert("Selecciona un PDF");
        return;
    }

    const resultado =
        document.getElementById("resultado");

    resultado.innerHTML =
        "Subiendo presentación...";

    const formData = new FormData();

    formData.append(
        "pdf",
        archivo
    );

    try{

        const response =
            await fetch(
                "/api/upload",
                {
                    method:"POST",
                    body: formData
                }
            );

        const data =
            await response.json();

        if(data.success){

            resultado.innerHTML =
                "Presentación actualizada correctamente";
        }
        else{

            resultado.innerHTML =
                 data.error;
        }

    }
    catch(ex){

        resultado.innerHTML =
             ex.message;
    }

}

</script>

</body>
</html>
